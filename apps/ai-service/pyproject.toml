[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hasan Forghani", email = "hasan.forghani25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.84.0",
