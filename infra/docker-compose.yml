name: inbox

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inbox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inbox"]
      interval: 5s
      timeout: 3s
      retries: 10
      
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API, for apps running on the host
      - "127.0.0.1:9644:9644"     # admin API (rpk, metrics)
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 15

  console:			 # Redpanda Console (optional)
    image: redpandadata/console:v3.12.0
    profiles: ["tools"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8088:8080"     # host 8080 is already taken
    depends_on:
      redpanda:
        condition: service_healthy

  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "127.0.0.1:3025:3025"     # SMTP
      - "127.0.0.1:3143:3143"     # IMAP
      - "127.0.0.1:8083:8080"     # REST API (host 8080 is taken)
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/3143"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC
      - "127.0.0.1:4318:4318"     # OTLP HTTP



volumes:
  pgdata:
  redpanda:


